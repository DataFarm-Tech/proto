// telemetry.pb.c/.pb.h are committed generated code, not built at compile
// time by consumers (the firmware's ESP-IDF nanopb component only vendors
// the runtime, not the generator). After editing this file or
// telemetry.options, regenerate with:
//
//   pip install --user nanopb
//   nanopb_generator -I. telemetry.proto
//
// then commit the updated telemetry.pb.c/.pb.h alongside this file.
// See README.md for details.
syntax = "proto3";

option java_package = "com.datafarmtech.telemetry";
option java_multiple_files = true;

// Manufacturing/hardware identity that used to travel only in the
// now-removed ActivateRequest (see nitra#162) -- since node_hw_metadata is
// created once (insert-if-missing, see process_gps), sending these on
// every GpsUpdateRequest costs nothing but a few bytes and means there's no
// separate first-contact message to keep in sync.
message GpsUpdateRequest {
    string   node_id  = 1;
    Position position = 2;
    Battery  battery  = 3;
    OtaStatus firmware = 4;
    NetStat  net_stat = 5;
    string   hw_ver      = 6;
    string   chassis_ver = 7;
    NetInfo  net_info    = 8;
}

message OtaStatus {
    string fw_ver    = 1;
    bool just_updated = 2;
    uint32 boot_count  = 3;
}

message Battery {
  float voltage  = 1; // volts, straight off the fuel-gauge/ADC reading
  float soc      = 2; // state of charge, percent 0-100
  bool  charging = 3; // true if actively charging (e.g. solar input present)
  float temp_c   = 4; // battery temperature, Celsius
}

message Position {
  float   lat        = 1;
  float   lon        = 2;
  fixed32 fix_time   = 3; // unix epoch seconds of the fix itself, not of message receipt
  float   accuracy_m = 4; // estimated horizontal accuracy, metres
  bool    fix_valid  = 5; // false if this is a stale/last-known fallback position, not a live fix

  // nsat from the modem's +QGPSLOC response -- 0 if unavailable/no fix.
  uint32 satellite_count = 6;

  // Wall-clock time the device spent acquiring this fix, start to finish
  // (successful or not) -- 0 only when acquisition was skipped outright
  // (GPS_SKIP_EN build flag or the gps_skip_enabled runtime flag), not a
  // real measurement of an instant fix.
  uint32 acquisition_duration_ms = 7;

  // Echoes whether this acquisition skipped the enable call + cold-start
  // wait (see GPS::acquireCoordinates()'s already_warm parameter) -- not a
  // detected outcome, since AT+QGPSLOC has no way to report whether a fix
  // was actually warm/hot vs. a true cold start.
  bool warm_start = 8;
}

// SIM/module identity — fixed to the physical hardware, doesn't change without a SIM swap.
message NetInfo {
  string iccid = 1;
  string imei  = 2;
  string imsi  = 3;
}

// Which cell/network the device is on right now, and how good that connection is —
// travels with each GpsUpdateRequest so it can be correlated with position over time.
message NetStat {
  sint32 rsrq     = 1;
  sint32 sinr     = 2;
  string carrier  = 3; // mobile network operator name (not "operator" -- that's a reserved word in C++, which nanopb's generated struct must compile under)
  bytes  cell_id  = 4;
  uint32 band     = 5;
  uint32 lac      = 6;
  uint32 rat      = 7;

  // Reference signal received power, dBm -- confirmed against Quectel's
  // documented AT+QCSQ output and this module's real output.
  sint32 rsrp = 8;

  // Raw AT+QCSQ RSSI field, deliberately left without a dBm unit: the
  // documented example shows a negative dBm value here, but this module
  // reports a small positive integer in the same position -- an unresolved
  // discrepancy against Quectel's own documentation (see the firmware's
  // SignalQuality struct doc comment).
  sint32 rssi = 9;
}

message ReadingRequest {
    reserved 3;
    reserved "readings";

    string node_id  = 1;
    string m_type    = 2;
    uint64 session   = 4;
    // Already scaled to physical units and aggregated on-device (divisor
    // conversion, min/max range filter, z-score outlier rejection, median)
    // -- the server only classifies/persists this value, it no longer
    // aggregates raw samples itself.
    float  reading   = 5;
    // Unix epoch seconds when this reading was actually collected on-device
    // (via the NTP-synced system clock -- see AppRuntime::syncTime(), which
    // runs earlier in the same wake cycle), NOT when the server received
    // it. Lets the server key on when the measurement was actually taken
    // rather than when the request happened to arrive -- which matters once
    // a failed send can be buffered and retried in a later cycle, since
    // "arrived at the server" and "collected on-device" are then no longer
    // the same moment. Matches WalkTestPoint.timestamp's convention.
    fixed32 timestamp = 6;
}

// Batched form of ReadingRequest: every measurement type from one collection
// cycle in a single CoAP round-trip (one modem exchange) instead of one
// ReadingRequest message -- and one modem round-trip -- per type. Sent to
// its own "reading-batch" resource; ReadingRequest and the "reading"
// resource stay in place unchanged alongside it.
message ReadingBatchRequest {
    string node_id  = 1;
    uint64 session   = 2;
    repeated ReadingEntry readings = 3;
    // Unix epoch seconds when this batch was collected -- see
    // ReadingRequest.timestamp above. One value for the whole batch since
    // NPK::collectAllMeasurements() reads every measurement type in a
    // single Modbus pass, not one type at a time.
    fixed32 timestamp = 4;
}

message ReadingEntry {
    string m_type  = 1;
    // Already scaled/aggregated on-device -- see ReadingRequest.reading.
    float  reading = 2;
}

message StringValue {
    string value = 1;
}

// Minimal liveness/identity ping sent once, right after the device connects
// to the network -- deliberately lightweight (no signal/network info, which
// travels with GpsUpdateRequest.net_stat moments later) so it lands quickly
// even if GPS acquisition or the rest of the boot cycle takes a while.
message HealthRequest {
    string node_id     = 1;
    string boot_reason = 2; // e.g. "power-on", "deep sleep wake", "task watchdog"
    string fw_ver      = 3;

    // Round-trip time of the *previous* cycle's health ping, in milliseconds
    // -- not this one. A request can't carry the RTT of its own not-yet-
    // received response, so the firmware times each ping's send-to-ACK
    // interval, stashes it in RTC memory (survives deep sleep), and reports
    // it one cycle later. 0 if no prior measurement is available yet (e.g.
    // first boot, or a cold power-on that cleared RTC memory).
    uint32 rtt_ms = 4;

    // Free-heap low-water-mark (bytes) from the *previous* wake cycle, same
    // one-cycle-delayed reporting as rtt_ms and for the same reason: this
    // ping fires early (right after connect, before OTA/GPS/collection/log
    // upload -- the cycle's actual memory-heavy work), so its own cycle's
    // minimum isn't known yet. Captured instead right before the previous
    // cycle's deep sleep, once everything had run, and stashed in RTC memory.
    // 0 if no prior measurement is available yet.
    uint32 prev_cycle_min_free_bytes = 5;

    // LittleFS bytes in use (see the "littlefs" partition) as of the
    // *previous* wake cycle -- same one-cycle-delayed reporting as
    // prev_cycle_min_free_bytes and for the same reason. 0 if no prior
    // measurement is available yet, or if the filesystem wasn't mounted at
    // capture time.
    uint32 prev_cycle_fs_used_bytes = 6;

    // Count of response-waiting CoAP exchanges (Health, Config fetch,
    // firmware-version check -- see RttTracker.hpp in the firmware) the
    // *previous* cycle attempted, and how many of those actually got a
    // response, same one-cycle-delayed reporting as the fields above and
    // for the same reason. succeeded/attempted is a real packet-loss
    // figure for that cycle; 0/0 if no prior cycle data is available yet.
    uint32 prev_cycle_exchanges_attempted = 7;
    uint32 prev_cycle_exchanges_succeeded = 8;

    // How long the *previous* wake cycle's GPS acquisition took (milliseconds),
    // same one-cycle-delayed reporting as the fields above and for the same
    // reason -- this ping fires before GPS acquisition even runs, so its own
    // cycle's duration isn't known yet. Mirrors GpsUpdateRequest.position.
    // acquisition_duration_ms, but GPS only actually runs roughly once a
    // week (see nitra's gpsBootOffset), so most cycles never send a
    // GpsUpdateRequest at all -- this field is what fires every cycle
    // regardless, reporting whenever GPS last actually ran. 0 if no prior
    // measurement is available yet, or GPS acquisition was skipped entirely
    // (GPS_SKIP_EN/gps_skip_enabled).
    uint32 prev_cycle_gps_fix_ms = 9;
}

// Sent alongside the GET to /config so the server knows which node's
// config to look up -- the request itself carries no other CoAP-level
// identity, unlike POST/PUT endpoints where node_id travels with the rest
// of the payload.
message ConfigRequest {
    string node_id = 1;
}

// Sent as the body of the firmware-version-check request (a CoAP FETCH, not
// a bare GET -- Californium's OSCORE layer rejects a payload on GET/DELETE
// when reconstructing the decrypted inner request, same reason ConfigRequest
// travels over FETCH rather than GET) so the server can refuse to offer an
// update to hardware the latest release no longer supports, instead of
// unconditionally handing back the newest version regardless of hw_ver.
message FirmwareVersionRequest {
    string hw_ver = 1;
}

// Node configuration fetched via a GET right after connecting, alongside
// HealthRequest -- looked up from the node_config table server-side.
message ConfigResponse {
    uint32 main_app_delay = 1; // seconds between check-in cycles

    // If true, a wake whose primary (SIM) connection fails to come up
    // retries once over WiFi before giving up on the wake entirely. Doesn't
    // change the primary connection method -- SIM is still tried first on
    // every wake regardless of this flag.
    bool wifi_backup_enabled = 2;

    // Credentials for the WiFi backup connection above. Consumers may treat
    // an empty value as "no change" and keep whatever WiFi credentials
    // (build-time default or previously configured) they already have.
    string wifi_ssid     = 3;
    string wifi_password = 4;

    // Per-channel calibration factors applied to raw sensor readings.
    // Default to 1.0 (no adjustment) when not configured server-side.
    float conductivity_factor = 5;
    float moisture_factor     = 6;
    float ph_factor           = 7;
    float nitrogen_factor     = 8;
    float phosphorus_factor   = 9;
    float potassium_factor    = 10;
    float temperature_factor  = 11;
    RATType rat_type = 12;

    // If true, GPS acquisition runs on every wake instead of the default
    // once-a-week throttle (see AppRuntime::runCycle()'s should_trigger_gps).
    // Costs real time (30-90+s per fix, longer cold) and power every cycle --
    // off by default.
    bool gps_every_cycle = 13;

    // Hex string for the modem's AT+QCFG="band" LTE band mask (e.g.
    // "0x400A0E189F"), restricting registration search to only the LTE
    // bands actually present at this device's deployment site instead of
    // scanning every band the module supports -- shortens registration
    // time (and the power it costs) on every wake. Empty means "no change,
    // leave whatever mask (or lack of one) is already applied" -- same
    // convention as wifi_ssid/wifi_password above, since proto3 singular
    // strings have no field-presence flag to distinguish "unset" from
    // "explicitly cleared". Applied to the modem every boot in nitra's
    // SimModem::stepInit() via ATCommandHndlr::setLteBandMask().
    string lte_bandmask = 14;
}

enum RATType {
    LTE_M = 0;  // LTE-M (Cat-M1) cellular RAT
    NB_IoT = 1; // NB-IoT (Cat-NB1) cellular RAT
}

// One chunk of the node's system.log file, sent right after HealthRequest
// at boot. The log can exceed a single UDP/OSCORE payload, so it's split
// into fixed-size chunks and reassembled server-side by (node_id,
// upload_id) -- upload_id is just the node's boot_count, reused rather
// than tracking a separate counter, since one upload happens per boot.
message LogChunk {
    string node_id     = 1;
    uint32 upload_id    = 2;
    uint32 chunk_index  = 3; // 0-based
    uint32 total_chunks = 4;
    string data         = 5;
}

// One GPS+signal snapshot recorded by the CLI's `walktest` command, sent to
// its own dedicated endpoint (not update-gps) once the recording window
// closes -- one WalkTestPoint per point recorded, sent back-to-back rather
// than a single batched/repeated-field message. Deliberately slimmer than
// GpsUpdateRequest: no battery/OTA/manufacturing-identity fields, since a
// walk test around a property is a one-off diagnostic session, not part of
// the regular telemetry stream.
message WalkTestPoint {
    string   node_id   = 1;
    Position position  = 2;
    NetStat  net_stat  = 3;
    // Unix epoch seconds this point was recorded -- separate from
    // position.fix_time, which is the GPS fix's own timestamp and is stale/
    // meaningless when position.fix_valid is false (no real fix that cycle).
    fixed32  timestamp = 4;
    // True only when the modem actually reported signal service at this
    // point (rsrq/sinr are real readings, not proto3's zero default).
    // net_stat can be present (has_net_stat) purely from carrier/cell
    // identity being known even with no service, so that flag alone can't
    // distinguish "genuinely rsrq=0" from "no signal at all" -- without
    // this, a dead zone silently reads as a perfect signal instead.
    bool     has_signal = 5;
}
